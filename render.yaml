services:
  - type: web
    name: frappe-client-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_dev.py"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_2FA
        value: "false"
      - key: ENABLE_DEV_STAFF
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "*"
